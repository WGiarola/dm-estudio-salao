<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — D&M Estúdio</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b0b0c;
      --card: #121214;
      --border: #29292d;
      --text: #f5f1e8;
      --muted: #a8a5a0;
      --gold: #d8bb84;
      --error: #e58b8b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0e0e10;
      color: var(--text);
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #17130c;
      font-weight: 700;
      cursor: pointer;
    }

    #mensagem {
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Redefinir senha</h1>

    <p>
      Digite sua nova senha para acessar o painel administrativo.
    </p>

    <form id="formReset">
      <label for="novaSenha">Nova senha</label>
      <input
        id="novaSenha"
        type="password"
        minlength="6"
        required
        autocomplete="new-password"
      >

      <label for="confirmarSenha">Confirmar nova senha</label>
      <input
        id="confirmarSenha"
        type="password"
        minlength="6"
        required
        autocomplete="new-password"
      >

      <button type="submit" id="btnReset">
        Salvar nova senha
      </button>

      <p id="mensagem"></p>
    </form>
  </main>

  <script>
    const SUPABASE_URL="https://uglhbnbylbyeivpsrwvg.supabase.co";
    const SUPABASE_KEY="sb_publishable_jLcnt4fC899DcVrrB2SGZw_kWu3Br-A";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('formReset');
    const novaSenha = document.getElementById('novaSenha');
    const confirmarSenha = document.getElementById('confirmarSenha');
    const btnReset = document.getElementById('btnReset');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();

      mensagem.textContent = '';

      if (novaSenha.value.length < 6) {
        mensagem.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
        return;
      }

      if (novaSenha.value !== confirmarSenha.value) {
        mensagem.textContent = 'As senhas não são iguais.';
        return;
      }

      btnReset.disabled = true;
      btnReset.textContent = 'Salvando...';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: novaSenha.value
        });

        if (error) {
          mensagem.textContent = error.message;
          return;
        }

        mensagem.textContent =
          'Senha alterada com sucesso. Agora você pode entrar no painel.';

        setTimeout(() => {
          window.location.href = 'adm.html';
        }, 1800);

      } catch (err) {
        console.error(err);
        mensagem.textContent =
          'Não foi possível alterar a senha.';
      } finally {
        btnReset.disabled = false;
        btnReset.textContent = 'Salvar nova senha';
      }
    });
  </script>

</body>
</html>
